name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests-and-plugins:
    # Keep OS upgrades explicit rather than following ubuntu-latest migrations.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Validate all JSON manifests + hooks parse
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "ok  $f"
            else
              echo "BAD $f"; fail=1
            fi
          done < <(git ls-files \
            '.github/plugin/*.json' \
            'plugins/*/plugin.json' \
            'plugins/*/hooks/hooks.json')
          exit $fail

      - name: Validate Copilot plugins
        run: python3 scripts/validate-plugins.py

      - name: Run validator unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run plugin extension tests
        # Node expands the quoted glob itself (Node 22+).
        run: node --test 'plugins/*/extensions/**/*.test.mjs'
