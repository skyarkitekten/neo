<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#57606a"/></marker></defs>
<rect width="1280" height="610" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#1f2328">Neo Architecture Engineer: assessment pipeline</text>
<text x="30" y="62" font-size="13" fill="#57606a">One orchestrator, ten kinds of agent. Every stage returns a fixed template; stacked cards run in parallel.</text>
<rect x="30" y="130" width="190" height="110" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="125.0" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Scout</text>
<text x="125.0" y="186" text-anchor="middle" font-size="12.5" fill="#424a53">Reads the repo,</text>
<text x="125.0" y="203" text-anchor="middle" font-size="12.5" fill="#424a53">writes the reader brief</text>
<text x="125.0" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">1 agent</text>
<rect x="298" y="116" width="190" height="110" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<rect x="291" y="123" width="190" height="110" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<rect x="284" y="130" width="190" height="110" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="379.0" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Readers</text>
<text x="379.0" y="186" text-anchor="middle" font-size="12.5" fill="#424a53">One per area, same</text>
<text x="379.0" y="203" text-anchor="middle" font-size="12.5" fill="#424a53">template each</text>
<text x="379.0" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0969da">8 to 11 parallel</text>
<rect x="552" y="116" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<rect x="545" y="123" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<rect x="538" y="130" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="633.0" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Designers</text>
<text x="633.0" y="186" text-anchor="middle" font-size="12.5" fill="#424a53">Smallest change /</text>
<text x="633.0" y="203" text-anchor="middle" font-size="12.5" fill="#424a53">mirror existing / first-class</text>
<text x="633.0" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6700">3 parallel</text>
<rect x="806" y="116" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<rect x="799" y="123" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
<rect x="792" y="130" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="887.0" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Judges</text>
<text x="887.0" y="186" text-anchor="middle" font-size="12.5" fill="#424a53">Maintainer / domain /</text>
<text x="887.0" y="203" text-anchor="middle" font-size="12.5" fill="#424a53">security lens</text>
<text x="887.0" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6700">3 parallel</text>
<rect x="1046" y="130" width="190" height="110" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
<text x="1141.0" y="164" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Synthesizer</text>
<text x="1141.0" y="186" text-anchor="middle" font-size="12.5" fill="#424a53">Winner + grafts,</text>
<text x="1141.0" y="203" text-anchor="middle" font-size="12.5" fill="#424a53">max 16 reuse claims</text>
<text x="1141.0" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#9a6700">1 agent</text>
<line x1="220" y1="185.0" x2="284" y2="185.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="488" y1="185.0" x2="538" y2="185.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="742" y1="185.0" x2="792" y2="185.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="996" y1="185.0" x2="1046" y2="185.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<text x="125.0" y="262" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: reader brief</text>
<text x="379.0" y="262" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: 1 evidence map each</text>
<text x="633.0" y="262" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: 3 designs</text>
<text x="887.0" y="262" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: 3 scored rankings</text>
<text x="1141.0" y="262" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: synthesis + claims</text>
<line x1="513.0" y1="100" x2="513.0" y2="280" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="513.0" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">BARRIER 1</text>
<text x="513.0" y="298" text-anchor="middle" font-size="11.5" fill="#cf222e">all readers return first</text>
<path d="M1141.0,274 V320 H125.0 V356" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<text x="640.0" y="338" text-anchor="middle" font-size="12" fill="#57606a" font-style="italic">each load-bearing reuse claim goes to its own refuter</text>
<rect x="44" y="356" width="190" height="110" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<rect x="37" y="363" width="190" height="110" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<rect x="30" y="370" width="190" height="110" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
<text x="125.0" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Refuters</text>
<text x="125.0" y="426" text-anchor="middle" font-size="12.5" fill="#424a53">Try to refute one claim;</text>
<text x="125.0" y="443" text-anchor="middle" font-size="12.5" fill="#424a53">default verdict: REFUTED</text>
<text x="125.0" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">1 per claim, up to 16</text>
<rect x="284" y="370" width="190" height="110" rx="10" fill="#f6e8ff" stroke="#8250df" stroke-width="2"/>
<text x="379.0" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Critic</text>
<text x="379.0" y="426" text-anchor="middle" font-size="12.5" fill="#424a53">What nobody read, what is</text>
<text x="379.0" y="443" text-anchor="middle" font-size="12.5" fill="#424a53">unverified or overbuilt</text>
<text x="379.0" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#8250df">1 agent</text>
<rect x="538" y="370" width="190" height="110" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="633.0" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Report writer</text>
<text x="633.0" y="426" text-anchor="middle" font-size="12.5" fill="#424a53">Markdown + Mermaid,</text>
<text x="633.0" y="443" text-anchor="middle" font-size="12.5" fill="#424a53">carries corrected grades</text>
<text x="633.0" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">1 agent</text>
<rect x="806" y="356" width="190" height="110" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<rect x="799" y="363" width="190" height="110" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<rect x="792" y="370" width="190" height="110" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
<text x="887.0" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Fact-checkers</text>
<text x="887.0" y="426" text-anchor="middle" font-size="12.5" fill="#424a53">Repo facts / external</text>
<text x="887.0" y="443" text-anchor="middle" font-size="12.5" fill="#424a53">claims / doc structure</text>
<text x="887.0" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">3 parallel</text>
<line x1="234" y1="425.0" x2="284" y2="425.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="474" y1="425.0" x2="538" y2="425.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<line x1="728" y1="425.0" x2="792" y2="425.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<text x="125.0" y="502" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: verdict + corrected grade</text>
<text x="379.0" y="502" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: critique + gating question</text>
<text x="633.0" y="502" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: draft report</text>
<text x="887.0" y="502" text-anchor="middle" font-size="11.5" fill="#57606a" font-style="italic">emits: severity-tagged findings</text>
<line x1="259.0" y1="340" x2="259.0" y2="520" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="259.0" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#cf222e">BARRIER 2</text>
<text x="259.0" y="538" text-anchor="middle" font-size="11.5" fill="#cf222e">all refuters return first</text>
<rect x="1046" y="380" width="190" height="90" rx="45.0" fill="#1f2328"/>
<text x="1141.0" y="418" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Assessment report</text>
<text x="1141.0" y="438" text-anchor="middle" font-size="12" fill="#d0d7de">errors fixed, then delivered</text>
<line x1="996" y1="425.0" x2="1046" y2="425.0" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
<text x="30" y="592" text-anchor="start" font-size="12" fill="#cf222e" font-weight="700">Refutation is the stage that changes the answer most: about a third of reuse claims were downgraded in the source run.</text>
</svg>